# ============================================================================
# Logicodex CI — single-engine (HIR) era.
#
# Guards what actually protects the code today:
#   check        — formatting + clippy + cargo check
#   test         — cargo build + full cargo test suite (includes the shipped-
#                  examples semantic-check gate) — the real drift-resistant QA
#   freestanding — x86_64 QEMU boot proof (make boot-evidence) + the one live
#                  freestanding validator
#
# NOTE: the v1.21-v1.45 sprint/pipeline validators were archived under
# scripts/validators/_archive_pre_hir/ — they structurally test a retired
# architecture and are not run here. See that folder's README.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
  LLVM_CONFIG_PATH: /usr/lib/llvm-23/bin/llvm-config
  RUSTFLAGS: "-L/usr/lib/llvm-23/lib"
  RAYLIB_NO_LINK: "1"

jobs:
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify stdlib contracts
        run: python3 tools/verify_stdlib_contracts.py
      - name: Verify integrity runner contracts
        run: |
          bash -n scripts/dev/verify_full_integrity.sh
          bash -n scripts/dev/verify_quick_integrity.sh
          grep -Fq 'cargo check --all-targets' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'cargo test --quiet --lib' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'FOCUSED_TEST' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'cargo test --quiet' scripts/dev/verify_full_integrity.sh
          grep -Fq 'cargo build --release' scripts/dev/verify_full_integrity.sh
          grep -Fq 'make boot-evidence' scripts/dev/verify_full_integrity.sh
          grep -Fq 'make boot-e2e' scripts/dev/verify_full_integrity.sh
          grep -Fq 'validate_v144_freestanding.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_stdlib_stage0.sh' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_cpb_self_hosting_runway.sh' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_architecture_change_control.sh' scripts/dev/verify_full_integrity.sh
          grep -Fq 'test_version_reference_hygiene.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'verify_version_reference_hygiene.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'test_version_reference_hygiene.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_version_reference_hygiene.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'test_code_lifecycle.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'verify_code_lifecycle.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'test_code_lifecycle.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_code_lifecycle.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'test_authority_docs.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'verify_authority_docs.py' scripts/dev/verify_quick_integrity.sh
          grep -Fq 'test_authority_docs.py' scripts/dev/verify_full_integrity.sh
          grep -Fq 'verify_authority_docs.py' scripts/dev/verify_full_integrity.sh
      - name: Install LLVM 23
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --batch --yes -o /etc/apt/keyrings/llvm-snapshot.gpg
          actual=$(gpg --show-keys --with-colons /etc/apt/keyrings/llvm-snapshot.gpg \
            | awk -F: '$1 == "fpr" {print $10}')
          grep -Fxq 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421 <<<"$actual"
          grep -Fxq 56E1477F57BAB5ECF37818045B3D8846AF9463CE <<<"$actual"
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-23-dev libclang-23-dev libpolly-23-dev libzstd-dev pkg-config
          for package in llvm-23-dev libclang-23-dev libpolly-23-dev; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$version" =~ ^1:23\.1\.6~ ]]
            printf '%s=%s\n' "$package" "$version"
          done
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Verify LLVM 23 + Rust 1.100.0
        run: |
          set -euo pipefail
          [[ "$(rustc --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(cargo --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-ubuntu24.04-llvm23.1.6-rust1.100.0-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: cargo check
        run: cargo check --all-targets

  test:
    name: Test (full suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 23
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --batch --yes -o /etc/apt/keyrings/llvm-snapshot.gpg
          actual=$(gpg --show-keys --with-colons /etc/apt/keyrings/llvm-snapshot.gpg \
            | awk -F: '$1 == "fpr" {print $10}')
          grep -Fxq 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421 <<<"$actual"
          grep -Fxq 56E1477F57BAB5ECF37818045B3D8846AF9463CE <<<"$actual"
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-23-dev libclang-23-dev libpolly-23-dev libzstd-dev pkg-config
          for package in llvm-23-dev libclang-23-dev libpolly-23-dev; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$version" =~ ^1:23\.1\.6~ ]]
            printf '%s=%s\n' "$package" "$version"
          done
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Verify LLVM 23 + Rust 1.100.0
        run: |
          set -euo pipefail
          [[ "$(rustc --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(cargo --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-ubuntu24.04-llvm23.1.6-rust1.100.0-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Run stdlib contract cases
        run: python3 tools/verify_stdlib_contracts.py --run-cases --bin target/release/logicodex
      - name: Run full test suite
        run: cargo test 2>&1 | tee test-output.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-output-log
          path: test-output.log

  freestanding:
    name: Freestanding x86_64 QEMU boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 23 + QEMU + binutils
        # LLVM is needed because boot-e2e builds the compiler (cargo run) to
        # compile showcase.ldx; QEMU + binutils boot/link the kernel.
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --batch --yes -o /etc/apt/keyrings/llvm-snapshot.gpg
          actual=$(gpg --show-keys --with-colons /etc/apt/keyrings/llvm-snapshot.gpg \
            | awk -F: '$1 == "fpr" {print $10}')
          grep -Fxq 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421 <<<"$actual"
          grep -Fxq 56E1477F57BAB5ECF37818045B3D8846AF9463CE <<<"$actual"
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-23-dev libclang-23-dev libpolly-23-dev libzstd-dev pkg-config qemu-system-x86 binutils
          for package in llvm-23-dev libclang-23-dev libpolly-23-dev; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$version" =~ ^1:23\.1\.6~ ]]
            printf '%s=%s\n' "$package" "$version"
          done
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none
      - name: Verify LLVM 23 + Rust 1.100.0
        run: |
          set -euo pipefail
          [[ "$(rustc --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(cargo --version | awk '{print $2}')" == '1.100.0' ]]
          [[ "$(/usr/lib/llvm-23/bin/llvm-config --version)" == '23.1.6' ]]
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-ubuntu24.04-llvm23.1.6-rust1.100.0-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Boot evidence (multiboot -> long-mode -> serial 'Logicodex' -> clean exit 33)
        # build.sh unsets RUSTFLAGS internally so the inherited LLVM -L flag does
        # not override the freestanding target's relocation-model/linker rustflags.
        run: make boot-evidence
      - name: End-to-end .ldx -> kernel boot (#4)
        # Compiles examples/freestanding/showcase.ldx, links it into the kernel,
        # boots in QEMU, asserts the program's own output (10 20 55 17 36).
        run: make boot-e2e
      - name: Freestanding capability validator
        run: python3 scripts/validators/tier_c_stress/validate_v144_freestanding.py
